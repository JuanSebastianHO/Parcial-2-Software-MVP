<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexLearn — Capacitación Corporativa</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            indigo: { 600: '#4f46e5', 700: '#3730a3' }
          }
        }
      }
    }
  </script>
</head>
<body class="min-h-screen bg-slate-50 flex items-center justify-center p-4"
      style="background: radial-gradient(ellipse at 30% 20%, rgba(99,102,241,.08) 0%, transparent 50%),
                         radial-gradient(ellipse at 80% 80%, rgba(139,92,246,.06) 0%, transparent 50%), #f8fafc;">

  <div class="w-full max-w-md animate-fade-in">

    <!-- Logo -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-indigo-600 shadow-lg mb-4">
        <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
        </svg>
      </div>
      <h1 class="text-2xl font-bold text-slate-900">NexLearn</h1>
      <p class="text-slate-500 text-sm mt-1">Plataforma de Capacitación Corporativa</p>
    </div>

    <!-- Card -->
    <div class="login-card">
      <h2 class="text-lg font-bold text-slate-800 mb-6">Iniciar sesión</h2>

      <div id="error-msg" class="hidden mb-4 px-4 py-3 bg-red-50 border border-red-200 text-red-700 text-sm rounded-xl"></div>

      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1.5">Correo corporativo</label>
          <input id="username" type="email" class="form-input" placeholder="usuario@nexlearn.co"
                 autocomplete="username">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1.5">Contraseña</label>
          <input id="password" type="password" class="form-input" placeholder="••••••••"
                 autocomplete="current-password">
        </div>
        <button onclick="handleLogin()" class="btn-primary mt-2" id="btn-login">
          Ingresar a la plataforma
        </button>
      </div>

      <!-- Demo credentials -->
      <div class="mt-6 p-4 bg-slate-50 rounded-xl border border-slate-200">
        <p class="text-xs font-bold text-slate-500 mb-2 uppercase tracking-wider">Credenciales demo</p>
        <div class="space-y-2">
          <div class="flex items-center justify-between">
            <span class="text-xs text-slate-600">Admin</span>
            <button onclick="fillDemo('admin@nexlearn.co','Admin2024!')"
              class="text-xs text-indigo-600 font-semibold hover:text-indigo-800">
              admin@nexlearn.co / Admin2024!
            </button>
          </div>
          <div class="flex items-center justify-between">
            <span class="text-xs text-slate-600">Empleado</span>
            <button onclick="fillDemo('juan@nexlearn.co','Emp2024!')"
              class="text-xs text-indigo-600 font-semibold hover:text-indigo-800">
              juan@nexlearn.co / Emp2024!
            </button>
          </div>
        </div>
      </div>
    </div>

    <p class="text-center text-xs text-slate-400 mt-6">
      © 2024 NexLearn · Capacitación Corporativa Inteligente
    </p>
  </div>

  <script src="js/auth.js"></script>
  <script>
    // Redirigir si ya tiene sesión activa
    window.addEventListener("DOMContentLoaded", () => {
      const session = getSession();
      if (session) {
        window.location.href = "dashboard.html";
      }

      // Enter key
      document.getElementById("password").addEventListener("keydown", e => {
        if (e.key === "Enter") handleLogin();
      });
    });

    function handleLogin() {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      const errorEl  = document.getElementById("error-msg");
      const btn      = document.getElementById("btn-login");

      // Spinner
      btn.innerHTML = '<div class="spinner mx-auto" style="width:20px;height:20px;border-width:2px;border-top-color:white"></div>';
      btn.disabled  = true;

      setTimeout(() => {
        const result = login(username, password);
        if (result.success) {
          window.location.href = result.user.role === "admin" ? "admin.html" : "dashboard.html";
        } else {
          errorEl.textContent = result.error;
          errorEl.classList.remove("hidden");
          btn.innerHTML = "Ingresar a la plataforma";
          btn.disabled  = false;
        }
      }, 600);
    }

    function fillDemo(user, pass) {
      document.getElementById("username").value = user;
      document.getElementById("password").value = pass;
    }
  </script>
</body>
</html>
