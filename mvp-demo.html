<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NexLearn MVP — Taller Ingeniería de Software</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap');

  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'DM Sans',system-ui,sans-serif;background:#f8fafc;color:#0f172a;-webkit-font-smoothing:antialiased}
  :root{
    --accent:#4f46e5;--accent-d:#3730a3;--accent-l:#ede9fe;
    --success:#10b981;--warn:#f59e0b;--danger:#ef4444;
    --sidebar:#1e1b4b;--border:#e2e8f0;--text2:#64748b;--text3:#94a3b8;
    --card:#ffffff;--bg:#f8fafc;
  }
  .spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
  @keyframes bounceIn{0%{opacity:0;transform:scale(.8)}60%{transform:scale(1.06)}100%{opacity:1;transform:scale(1)}}
  .fu{animation:fadeUp .4s ease both}
  .bi{animation:bounceIn .45s cubic-bezier(.34,1.56,.64,1) both}
  .fu1{animation-delay:.05s}.fu2{animation-delay:.1s}.fu3{animation-delay:.15s}.fu4{animation-delay:.2s}
  /* Sidebar glass */
  #sidenav{background:var(--sidebar);position:relative;overflow:hidden;min-height:100vh;width:220px;flex-shrink:0;transition:width .3s}
  #sidenav::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 25% 25%,rgba(99,102,241,.3) 0,transparent 60%),radial-gradient(ellipse at 75% 80%,rgba(139,92,246,.2) 0,transparent 60%);pointer-events:none}
  /* Ring progress */
  .ring-wrap{position:relative;display:inline-flex;align-items:center;justify-content:center}
  .ring-wrap .ring-label{position:absolute;font-size:10px;font-weight:700;text-align:center}
  /* Scrollbars */
  ::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px}
  /* Quiz */
  .quiz-option{display:flex;align-items:center;gap:10px;padding:10px 14px;border:1.5px solid var(--border);border-radius:10px;cursor:pointer;transition:all .15s;margin-bottom:8px}
  .quiz-option:hover{border-color:var(--accent);background:#f0f0ff}
  .quiz-option.correct{border-color:var(--success);background:#ecfdf5;color:#065f46}
  .quiz-option.wrong{border-color:var(--danger);background:#fef2f2;color:#991b1b}
  /* Toast */
  .toast{position:fixed;bottom:24px;right:24px;padding:12px 20px;border-radius:12px;font-size:14px;font-weight:600;color:#fff;z-index:1000;animation:fadeUp .3s ease}
  .toast.ok{background:var(--success)}.toast.err{background:var(--danger)}
</style>
</head>
<body>

<!-- ══════════════════════════════════════════════════ -->
<!-- PANTALLA LOGIN -->
<!-- ══════════════════════════════════════════════════ -->
<div id="screen-login" class="min-h-screen flex items-center justify-center p-6"
     style="background:radial-gradient(ellipse at 30% 20%,rgba(99,102,241,.07) 0,transparent 50%),radial-gradient(ellipse at 80% 80%,rgba(139,92,246,.05) 0,transparent 50%),#f8fafc">
  <div class="w-full max-w-sm fu">
    <div class="text-center mb-8">
      <div style="display:inline-flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:14px;background:var(--accent);margin-bottom:14px">
        <svg width="26" height="26" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M12 6v13M12 6C10.8 5.5 9.2 5 7.5 5S4.2 5.5 3 6.3v13C4.2 18.5 5.8 18 7.5 18s3.3.5 4.5 1.3M12 6c1.2-.5 2.8-1 4.5-1 1.7 0 3.3.5 4.5 1.3v13c-1.2-.8-2.8-1.3-4.5-1.3S13.2 18.5 12 19.3"/></svg>
      </div>
      <h1 style="font-size:22px;font-weight:700;color:#0f172a">NexLearn</h1>
      <p style="color:var(--text2);font-size:13px;margin-top:4px">Capacitación Corporativa · MVP</p>
    </div>

    <div style="background:var(--card);border-radius:18px;border:1.5px solid var(--border);padding:32px;box-shadow:0 10px 40px rgba(0,0,0,.08)">
      <p style="font-size:15px;font-weight:600;margin-bottom:20px;color:#0f172a">Iniciar sesión</p>
      <div id="login-err" style="display:none;margin-bottom:14px;padding:10px 14px;background:#fef2f2;border:1px solid #fecaca;border-radius:10px;color:#b91c1c;font-size:13px"></div>
      <label style="display:block;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:6px">Usuario</label>
      <input id="inp-user" type="email" placeholder="usuario@nexlearn.co" value="juan@nexlearn.co"
        style="width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:10px;font-family:inherit;font-size:14px;margin-bottom:14px;outline:none;transition:border-color .2s"
        onfocus="this.style.borderColor='var(--accent)'" onblur="this.style.borderColor='var(--border)'">
      <label style="display:block;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:6px">Contraseña</label>
      <input id="inp-pass" type="password" placeholder="••••••••" value="Emp2024!"
        style="width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:10px;font-family:inherit;font-size:14px;margin-bottom:20px;outline:none;transition:border-color .2s"
        onfocus="this.style.borderColor='var(--accent)'" onblur="this.style.borderColor='var(--border)'"
        onkeydown="if(event.key==='Enter')doLogin()">
      <button onclick="doLogin()" id="btn-login"
        style="width:100%;padding:12px;background:var(--accent);color:#fff;border:none;border-radius:10px;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;transition:background .2s">
        Ingresar
      </button>

      <div style="margin-top:20px;padding:14px;background:#f8fafc;border-radius:10px;border:1px solid var(--border)">
        <p style="font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px">Demo rápido</p>
        <div style="display:flex;gap:8px">
          <button onclick="fillCreds('juan@nexlearn.co','Emp2024!')"
            style="flex:1;padding:8px;background:#fff;border:1px solid var(--border);border-radius:8px;font-size:12px;font-weight:600;color:var(--accent);cursor:pointer">
            Empleado
          </button>
          <button onclick="fillCreds('admin@nexlearn.co','Admin2024!')"
            style="flex:1;padding:8px;background:#fff;border:1px solid var(--border);border-radius:8px;font-size:12px;font-weight:600;color:#7c3aed;cursor:pointer">
            Admin
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════════════════════ -->
<!-- PANTALLA DASHBOARD (oculta al inicio) -->
<!-- ══════════════════════════════════════════════════ -->
<div id="screen-dashboard" style="display:none;height:100vh;overflow:hidden">
  <div style="display:flex;height:100vh">

    <!-- Sidenav -->
    <aside id="sidenav">
      <div style="position:relative;z-index:1;display:flex;flex-direction:column;height:100%;padding:0">
        <!-- Logo -->
        <div style="padding:20px;border-bottom:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:10px">
          <div style="width:34px;height:34px;border-radius:10px;background:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0">
            <svg width="18" height="18" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M9 4v10M9 4C8 3.6 6.8 3.3 5.5 3.3S3 3.6 2 4.2v10C3 13.6 4.2 13.3 5.5 13.3S8 13.6 9 14.2M9 4c1-.4 2.2-.7 3.5-.7s2.5.3 3.5.9v10c-1-.6-2.2-.9-3.5-.9S10 13.6 9 14.2"/></svg>
          </div>
          <span style="color:#fff;font-weight:700;font-size:15px">NexLearn</span>
        </div>
        <!-- Nav links -->
        <nav style="flex:1;padding:12px 8px;display:flex;flex-direction:column;gap:4px">
          <a id="nav-dashboard" onclick="showView('dashboard')" style="display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:rgba(255,255,255,.75);cursor:pointer;transition:all .15s;text-decoration:none;font-size:14px;background:rgba(255,255,255,.12)">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="3" width="7" height="7" rx="1"/><rect x="13" y="3" width="7" height="7" rx="1"/><rect x="2" y="14" width="7" height="7" rx="1"/><rect x="13" y="14" width="7" height="7" rx="1"/></svg>
            Mis Cursos
          </a>
          <a id="nav-admin" onclick="showView('admin')" style="display:none;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:rgba(255,255,255,.6);cursor:pointer;transition:all .15s;text-decoration:none;font-size:14px">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="6" r="3"/><path d="M2 21v-1a7 7 0 0114 0v1"/><circle cx="17" cy="7" r="2.5"/><path d="M22 21v-1a4.5 4.5 0 00-2.5-4"/></svg>
            Administrador
          </a>
        </nav>
        <!-- User -->
        <div style="padding:16px;border-top:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:10px">
          <div id="nav-avatar" style="width:32px;height:32px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;flex-shrink:0"></div>
          <div style="flex:1;min-width:0">
            <p id="nav-name" style="color:#fff;font-size:13px;font-weight:600;truncate;overflow:hidden;white-space:nowrap;text-overflow:ellipsis"></p>
            <p id="nav-role" style="color:rgba(255,255,255,.45);font-size:11px;text-transform:capitalize"></p>
          </div>
          <button onclick="doLogout()" title="Cerrar sesión" style="color:rgba(255,255,255,.35);background:none;border:none;cursor:pointer;padding:4px;border-radius:6px;transition:color .15s" onmouseover="this.style.color='rgba(255,255,255,.8)'" onmouseout="this.style.color='rgba(255,255,255,.35)'">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M16 17v-1a4 4 0 00-4-4H5a4 4 0 00-4 4v1"/><circle cx="8.5" cy="7" r="4"/><path d="M20 8h-6m3-3l3 3-3 3"/></svg>
          </button>
        </div>
      </div>
    </aside>

    <!-- Main area (scrollable) -->
    <div style="flex:1;display:flex;overflow:hidden">

      <!-- Feed -->
      <main id="main-content" style="flex:1;overflow-y:auto;padding:32px;height:100vh"></main>

      <!-- Right panel -->
      <aside id="right-panel" style="width:270px;overflow-y:auto;padding:24px 20px;border-left:1px solid var(--border);height:100vh;background:var(--bg);flex-shrink:0"></aside>

    </div>
  </div>
</div>

<!-- ══════════════════════════════════════════════════ -->
<!-- PANTALLA LECCIÓN (oculta) -->

<div id="screen-lesson" style="display:none;min-height:100vh;background:var(--bg)">

<!-- SCRIPT PRINCIPAL -->
<!-- ══════════════════════════════════════════════════ -->
<script>
// ════════════════════════════
// DATA
// ════════════════════════════
const COURSES = [
  {id:'c1',title:'Protección de Datos Personales',cat:'Cumplimiento Legal',dur:'3h 20min',img:'https://images.unsplash.com/photo-1563986768609-322da13575f3?w=500&q=70',
   lessons:[
    {id:'l1',title:'Introducción al RGPD y normativas locales',type:'video'},
    {id:'l2',title:'Principios del tratamiento de datos',type:'text'},
    {id:'l3',title:'Derechos del titular de los datos',type:'video'},
    {id:'l4',title:'Responsabilidades del empleado',type:'text'},
    {id:'l5',title:'Casos prácticos y sanciones',type:'video'},
   ]},
  {id:'c2',title:'Ética Empresarial y Código de Conducta',cat:'Cultura Corporativa',dur:'2h 45min',img:'https://images.unsplash.com/photo-1552664730-d307ca884978?w=500&q=70',
   lessons:[
    {id:'l1',title:'Fundamentos de ética organizacional',type:'text'},
    {id:'l2',title:'Conflictos de interés: identificación',type:'video'},
    {id:'l3',title:'Canal de denuncias y política de no represalia',type:'text'},
    {id:'l4',title:'Toma de decisiones éticas bajo presión',type:'video'},
   ]},
  {id:'c3',title:'Seguridad de la Información',cat:'Ciberseguridad',dur:'4h 10min',img:'https://images.unsplash.com/photo-1614064641938-3bbee52942c7?w=500&q=70',
   lessons:[
    {id:'l1',title:'Amenazas digitales: phishing y ransomware',type:'video'},
    {id:'l2',title:'Gestión segura de contraseñas',type:'text'},
    {id:'l3',title:'Uso seguro de dispositivos corporativos',type:'video'},
    {id:'l4',title:'Protocolos ante incidentes de seguridad',type:'text'},
    {id:'l5',title:'Teletrabajo seguro y VPN',type:'video'},
    {id:'l6',title:'Simulacro de respuesta a incidentes',type:'video'},
   ]},
  {id:'c4',title:'Comunicación Efectiva en el Entorno Laboral',cat:'Habilidades Blandas',dur:'2h 30min',img:'https://images.unsplash.com/photo-1542744173-8e7e53415bb0?w=500&q=70',
   lessons:[
    {id:'l1',title:'Escucha activa y empatía organizacional',type:'text'},
    {id:'l2',title:'Comunicación asertiva y no violenta',type:'video'},
    {id:'l3',title:'Comunicación escrita efectiva',type:'text'},
    {id:'l4',title:'Presentaciones de alto impacto',type:'video'},
   ]},
];

const QUIZ = {
  c1:[
    {q:'¿Cuál es el principio fundamental del RGPD?',opts:['Recopilar el máximo posible','Minimización de datos','Compartir libremente','Cifrado obligatorio'],ok:1},
    {q:'¿Qué derecho permite eliminar los datos del titular?',opts:['Derecho de acceso','Derecho de portabilidad','Derecho al olvido','Derecho de rectificación'],ok:2},
    {q:'¿En cuántas horas se debe notificar una brecha de datos?',opts:['24 horas','72 horas','7 días','30 días'],ok:1},
  ],
  c2:[
    {q:'¿Qué es un conflicto de interés en el trabajo?',opts:['Disputa con colegas','El interés personal interfiere con el profesional','Error en un contrato','Desacuerdo con cliente'],ok:1},
    {q:'¿Para qué sirve principalmente el canal de denuncias?',opts:['Quejarse del salario','Reportar conductas no éticas de forma segura','Solicitar vacaciones','Evaluar al jefe'],ok:1},
    {q:'¿Cuál es la base de una decisión ética?',opts:['El beneficio propio','La presión del jefe','El bien común y los valores corporativos','La rapidez de ejecución'],ok:2},
  ],
  c3:[
    {q:'¿Qué es el phishing?',opts:['Un tipo de virus','Ataque que suplanta identidades para robar datos','Un firewall','Un protocolo de red'],ok:1},
    {q:'¿Cuál es la práctica más segura para contraseñas?',opts:['Usar la misma para todo','Anotarlas en un papel','Gestor de contraseñas + doble factor','Compartirlas con el equipo'],ok:2},
    {q:'Ante un incidente de seguridad, el primer paso es:',opts:['Apagar el equipo sin avisar','Notificar al equipo de TI inmediatamente','Intentar solucionarlo solo','Ignorarlo si parece menor'],ok:1},
  ],
  c4:[
    {q:'La escucha activa implica:',opts:['Esperar que el otro termine','Atender con plena presencia y verificar comprensión','Tomar notas sin interactuar','Responder rápido'],ok:1},
    {q:'Un mensaje asertivo se caracteriza por:',opts:['Imponer el punto de vista','Expresar necesidades con respeto y claridad','Ceder siempre','Ser indirecto'],ok:1},
    {q:'¿Qué elemento es clave en una presentación de alto impacto?',opts:['Cantidad de texto','Mensaje claro con soporte visual y narración','Leer las diapositivas','Muchos colores'],ok:1},
  ],
};

const USERS_DB = [
  {id:'u1',name:'Juan Pérez',  user:'juan@nexlearn.co', pass:'Emp2024!',  role:'empleado'},
  {id:'u2',name:'María García',user:'maria@nexlearn.co',pass:'Emp2024!',  role:'empleado'},
  {id:'u3',name:'Carlos Ruiz', user:'carlos@nexlearn.co',pass:'Emp2024!', role:'empleado'},
  {id:'u4',name:'Laura Mendoza',user:'admin@nexlearn.co',pass:'Admin2024!',role:'admin'},
];

// ════════════════════════════
// STORAGE
// ════════════════════════════
const SK = 'nx_prog';
const getAllProg = ()=> JSON.parse(localStorage.getItem(SK)||'{}');
const getCourseProg = (uid,cid)=>{
  const all=getAllProg(); return all[uid]?.[cid]||{pct:0,done:[],score:null,last:null,status:'pending'};
};
const saveCourseProg = (uid,cid,upd)=>{
  const all=getAllProg(); if(!all[uid])all[uid]={};
  const cur=all[uid][cid]||{pct:0,done:[],score:null,last:null,status:'pending'};
  const merged={...cur,...upd,last:new Date().toISOString()};
  if(merged.pct>=100)merged.status='completed';
  else if(merged.pct>0)merged.status='in_progress';
  else merged.status='pending';
  all[uid][cid]=merged; localStorage.setItem(SK,JSON.stringify(all));
  return merged;
};
const completeLesson = (uid,cid,lid,total)=>{
  const cur=getCourseProg(uid,cid);
  const done=[...new Set([...cur.done,lid])];
  return saveCourseProg(uid,cid,{done,pct:Math.round(done.length/total*100)});
};
const resetUserProg = uid=>{
  const all=getAllProg(); delete all[uid]; localStorage.setItem(SK,JSON.stringify(all));
};
const getOverall = uid=>{
  const up=getAllProg()[uid]||{};
  const vals=Object.values(up);
  if(!vals.length)return 0;
  return Math.round(vals.reduce((s,c)=>s+(c.pct||0),0)/vals.length);
};

// ════════════════════════════
// AUTH
// ════════════════════════════
let SESSION = null;

function doLogin(){
  const u=document.getElementById('inp-user').value.trim();
  const p=document.getElementById('inp-pass').value;
  const errEl=document.getElementById('login-err');
  const btn=document.getElementById('btn-login');
  const found=USERS_DB.find(x=>x.user===u&&x.pass===p);
  btn.innerHTML='<div class="spinner" style="width:20px;height:20px;border-width:2px;border-top-color:#fff;margin:0 auto"></div>';
  btn.disabled=true;
  setTimeout(()=>{
    if(found){
      SESSION={id:found.id,name:found.name,role:found.role};
      errEl.style.display='none';
      document.getElementById('screen-login').style.display='none';
      document.getElementById('screen-dashboard').style.display='block';
      initDashboard();
    } else {
      errEl.textContent='Credenciales incorrectas. Verifica usuario y contraseña.';
      errEl.style.display='block';
      btn.innerHTML='Ingresar';
      btn.disabled=false;
    }
  },700);
}

function doLogout(){
  SESSION=null;
  document.getElementById('screen-dashboard').style.display='none';
  document.getElementById('screen-lesson').style.display='none';
  document.getElementById('screen-login').style.display='flex';
}

function fillCreds(u,p){
  document.getElementById('inp-user').value=u;
  document.getElementById('inp-pass').value=p;
}

// ════════════════════════════
// DASHBOARD
// ════════════════════════════
function initDashboard(){
  // Nav user
  document.getElementById('nav-avatar').textContent=SESSION.name.charAt(0);
  document.getElementById('nav-name').textContent=SESSION.name;
  document.getElementById('nav-role').textContent=SESSION.role;
  if(SESSION.role==='admin') document.getElementById('nav-admin').style.display='flex';
  showView('dashboard');
}

function showView(view){
  // nav highlight
  ['dashboard','admin'].forEach(v=>{
    const el=document.getElementById('nav-'+v); if(!el)return;
    el.style.background=v===view?'rgba(255,255,255,.12)':'transparent';
    el.style.color=v===view?'rgba(255,255,255,.9)':'rgba(255,255,255,.6)';
  });
  if(view==='dashboard') renderDashboard();
  else renderAdmin();
}

function renderDashboard(){
  renderRightPanel();
  const mc=document.getElementById('main-content');
  mc.innerHTML=`
    <div style="margin-bottom:28px" class="fu">
      <h1 style="font-size:22px;font-weight:700;color:#0f172a">Hola, ${SESSION.name.split(' ')[0]} 👋</h1>
      <p style="color:var(--text2);font-size:14px;margin-top:4px">Continúa donde lo dejaste</p>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px" id="course-grid"></div>
  `;
  const grid=document.getElementById('course-grid');
  grid.innerHTML=COURSES.map((c,i)=>courseCard(c,i)).join('');
}

function courseCard(course,i){
  const prog=getCourseProg(SESSION.id,course.id);
  const pct=prog.pct||0; const done=pct>=100;
  const catColors={
    'Cumplimiento Legal':'background:#fef3c7;color:#92400e',
    'Cultura Corporativa':'background:#ede9fe;color:#5b21b6',
    'Ciberseguridad':'background:#fee2e2;color:#991b1b',
    'Habilidades Blandas':'background:#d1fae5;color:#065f46',
  };
  const catStyle=catColors[course.cat]||'background:#f1f5f9;color:#475569';
  return `
    <div class="fu fu${i+1}" style="background:#fff;border-radius:18px;border:1.5px solid ${done?'#6ee7b7':'var(--border)'};overflow:hidden;transition:box-shadow .2s,transform .2s;cursor:pointer"
      onmouseover="this.style.boxShadow='0 8px 30px rgba(0,0,0,.1)';this.style.transform='translateY(-2px)'"
      onmouseout="this.style.boxShadow='none';this.style.transform='translateY(0)'">
      <div style="position:relative;height:140px;overflow:hidden">

        ${done?`<div style="position:absolute;top:10px;right:10px;background:#10b981;color:#fff;font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;display:flex;align-items:center;gap:4px">✓ Completado</div>`:''}
        <span style="position:absolute;bottom:10px;left:10px;${catStyle};font-size:11px;font-weight:600;padding:3px 10px;border-radius:999px">${course.cat}</span>
      </div>
      <div style="padding:16px">

        <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px">
          ${ringProgress(pct,42)}
          <div>
            <p style="font-size:12px;font-weight:600;color:#0f172a">${pct}% completado</p>
            <p style="font-size:11px;color:var(--text3)">${prog.done?.length||0}/${course.lessons.length} lecciones</p>
          </div>
          ${prog.score!=null?`<span style="margin-left:auto;font-size:11px;background:var(--accent-l);color:var(--accent);font-weight:600;padding:3px 10px;border-radius:999px">Quiz: ${prog.score}%</span>`:''}
        </div>
        ${done
          ? `<button onclick="showCertificate('${course.id}','${course.title.replace(/'/g,"&#39;")}')"
               style="width:100%;padding:10px;background:#10b981;color:#fff;border:none;border-radius:10px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px">
               ⬇ Descargar Certificado
             </button>`
          : `<button onclick="openCourse('${course.id}')"
               style="width:100%;padding:10px;background:var(--accent);color:#fff;border:none;border-radius:10px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer">
               ${pct>0?'Continuar':'Comenzar'}
             </button>`
        }
      </div>
    </div>
  `;
}

function ringProgress(pct,sz){
  const r=sz/2-4; const c=2*Math.PI*r; const off=c-(pct/100)*c;
  const col=pct>=100?'#10b981':pct>0?'var(--accent)':'#e2e8f0';
  return `
    <svg width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}" style="transform:rotate(-90deg);flex-shrink:0">
      <circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="#f1f5f9" stroke-width="4"/>
      <circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="${col}" stroke-width="4"
        stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"
        style="transition:stroke-dashoffset .8s ease"/>
      <text x="${sz/2}" y="${sz/2}" dominant-baseline="middle" text-anchor="middle"
        transform="rotate(90,${sz/2},${sz/2})"
        fill="${pct>=100?'#059669':'#4f46e5'}" font-size="9" font-weight="700">${pct}%</text>
    </svg>`;
}

function confirmReset(uid,name){
  const ov=document.createElement('div');
  ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:1000;backdrop-filter:blur(4px)';
  ov.innerHTML=`
    <div style="background:#fff;border-radius:18px;padding:32px;max-width:360px;width:90%;text-align:center;animation:bounceIn .4s ease both">
      <div style="font-size:40px;margin-bottom:12px">⚠️</div>
      <h3 style="font-size:17px;font-weight:700;color:#0f172a;margin-bottom:8px">¿Resetear progreso?</h3>
      <p style="color:var(--text2);font-size:13px;margin-bottom:24px">Se eliminará todo el progreso de <strong>${name}</strong>. Esta acción no puede deshacerse.</p>
      <div style="display:flex;gap:10px">
        <button onclick="this.closest('.fixed-overlay').remove()"
          class="btn-cancel" style="flex:1;padding:11px;background:#f1f5f9;color:#475569;border:none;border-radius:10px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer">
          Cancelar
        </button>
        <button onclick="doReset('${uid}');this.closest('.fixed-overlay').remove()"
          style="flex:1;padding:11px;background:#ef4444;color:#fff;border:none;border-radius:10px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer">
          Sí, resetear
        </button>
      </div>
    </div>`;
  ov.classList.add('fixed-overlay');
  document.body.appendChild(ov);
  ov.addEventListener('click',e=>{ if(e.target===ov)ov.remove(); });
  ov.querySelector('.btn-cancel').onclick=()=>ov.remove();
  ov.querySelector('button:last-child').onclick=()=>{ doReset(uid); ov.remove(); };
}

  CURRENT_COURSE=COURSES.find(c=>c.id===cid);

    CURRENT_LESSON_IDX=nextIdx>=0?nextIdx:0;

}

// ── Quiz ──
let quizAnswers=[];
function renderQuiz(){
  const lesson=CURRENT_COURSE.lessons[CURRENT_LESSON_IDX];
  const questions=QUIZ[CURRENT_COURSE.id]||[];
  quizAnswers=new Array(questions.length).fill(null);
  const card=document.getElementById('lesson-card');
  card.innerHTML=`
    <div class="fu">
      <div style="margin-bottom:20px">
        <span style="font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.07em">Mini-Quiz</span>
        <h3 style="font-size:17px;font-weight:700;color:#0f172a;margin-top:4px">${lesson.title}</h3>
        <p style="color:var(--text2);font-size:13px;margin-top:4px">Necesitas al menos 80% para continuar.</p>
      </div>
      ${questions.map((q,qi)=>`
        <div style="margin-bottom:18px">
          <p style="font-size:14px;font-weight:600;color:#0f172a;margin-bottom:10px">${qi+1}. ${q.q}</p>
          ${q.opts.map((opt,oi)=>`
            <label class="quiz-option" style="font-size:13px">
              <input type="radio" name="q${qi}" value="${oi}" onchange="quizAnswers[${qi}]=${oi}" style="accent-color:var(--accent)">
              ${opt}
            </label>`).join('')}
        </div>`).join('')}
      <button onclick="submitQuiz()"
        style="width:100%;padding:12px;background:var(--accent);color:#fff;border:none;border-radius:12px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;margin-top:8px">
        Enviar respuestas
      </button>
    </div>
  `;
}

function submitQuiz(){
  const questions=QUIZ[CURRENT_COURSE.id]||[];
  const correct=questions.reduce((s,q,i)=>s+(quizAnswers[i]===q.ok?1:0),0);
  const score=Math.round(correct/questions.length*100);
  const passed=score>=80;
  saveCourseProg(SESSION.id,CURRENT_COURSE.id,{score});
  renderQuizResult(score,passed);
}

function renderQuizResult(score,passed){
  const card=document.getElementById('lesson-card');
  const lesson=CURRENT_COURSE.lessons[CURRENT_LESSON_IDX];
  card.innerHTML=`
    <div class="bi" style="text-align:center;padding:20px 0">
      <div style="font-size:52px;margin-bottom:14px">${passed?'🎉':'📚'}</div>
      <h3 style="font-size:20px;font-weight:700;color:${passed?'#059669':'#d97706'};margin-bottom:8px">
        ${passed?'¡Excelente!':'Sigue practicando'}
      </h3>
      <p style="color:var(--text2);font-size:14px;margin-bottom:4px">Obtuviste <strong style="color:#0f172a">${score}%</strong> de respuestas correctas.</p>
      <p style="color:var(--text3);font-size:13px;margin-bottom:28px">${passed
        ?'Lección completada. El siguiente módulo ha sido desbloqueado.'
        :'Necesitas al menos 80% para avanzar. Revisa el contenido e inténtalo de nuevo.'}</p>
      <div style="display:flex;gap:10px;justify-content:center">
        ${passed
          ? `<button onclick="onLessonPassed()"
               style="padding:12px 28px;background:#10b981;color:#fff;border:none;border-radius:12px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer">
               Continuar →
             </button>`
          : `<button onclick="renderLessonMode()"
               style="padding:12px 28px;background:var(--warn);color:#fff;border:none;border-radius:12px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer">
               Reintentar
             </button>`}
        <button onclick="returnToDashboard()"
          style="padding:12px 28px;background:#f1f5f9;color:#475569;border:none;border-radius:12px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer">
          Dashboard
        </button>
      </div>
    </div>
  `;
}

function onLessonPassed(){
  const lesson=CURRENT_COURSE.lessons[CURRENT_LESSON_IDX];
  completeLesson(SESSION.id,CURRENT_COURSE.id,lesson.id,CURRENT_COURSE.lessons.length);
  const prog=getCourseProg(SESSION.id,CURRENT_COURSE.id);
  if(prog.pct>=100){
    // Course complete!
    const card=document.getElementById('lesson-card');
    card.innerHTML=`
      <div class="bi" style="text-align:center;padding:30px 0">
        <div style="font-size:64px;margin-bottom:16px">🏆</div>
        <h3 style="font-size:22px;font-weight:700;color:#059669;margin-bottom:10px">¡Curso Completado!</h3>
        <p style="color:var(--text2);font-size:14px;margin-bottom:28px">Has finalizado <strong style="color:#0f172a">${CURRENT_COURSE.title}</strong>. Tu certificado ya está disponible.</p>
        <button onclick="returnToDashboard()"
          style="padding:13px 32px;background:var(--accent);color:#fff;border:none;border-radius:12px;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer">
          Ver Dashboard
        </button>
      </div>`;
  } else {
    CURRENT_LESSON_IDX++;
    if(CURRENT_LESSON_IDX<CURRENT_COURSE.lessons.length) renderLessonMode();
    else returnToDashboard();
  }
}

// ════════════════════════════
// CERTIFICATE
// ════════════════════════════
function showCertificate(cid,title){
  const ov=document.createElement('div');
  ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:1000;backdrop-filter:blur(4px)';
  ov.innerHTML=`
    <div style="background:#fff;border-radius:20px;padding:40px;max-width:400px;width:90%;text-align:center;animation:bounceIn .45s ease both">
      <div style="font-size:56px;margin-bottom:14px">🎓</div>
      <h3 style="font-size:18px;font-weight:700;color:#0f172a;margin-bottom:8px">¡Certificado generado!</h3>
      <p style="color:var(--text2);font-size:13px;margin-bottom:6px">Certificado de finalización para:</p>
      <p style="color:#0f172a;font-size:14px;font-weight:600;margin-bottom:24px">"${title}"</p>
      <div style="background:#f0f4ff;border-radius:12px;padding:14px;margin-bottom:24px;border:1.5px dashed var(--accent)">
        <p style="font-size:12px;color:#4338ca;line-height:1.6">En producción, aquí se descargaría un PDF firmado digitalmente con sello de la empresa, fecha y folio único de verificación.</p>
      </div>
      <button onclick="this.closest('[style]').remove()"
        style="width:100%;padding:11px;background:var(--accent);color:#fff;border:none;border-radius:12px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer">
        Cerrar
      </button>
    </div>`;
  document.body.appendChild(ov);
  ov.addEventListener('click',e=>{ if(e.target===ov)ov.remove(); });
}

// ════════════════════════════
// UTILS
// ════════════════════════════
function toast(msg,type='ok'){
  const t=document.createElement('div');
  t.className=`toast ${type}`;
  t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),3000);
}
</script>
</body>
</html>
